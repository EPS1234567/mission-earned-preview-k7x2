<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Applications | Mission Earned</title>
<link rel="stylesheet" href="/assets/css/main.css">
<link rel="stylesheet" href="/assets/css/staff.css">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>

<header class="admin-bar">
  <div class="container admin-bar__inner">
    <h1>Applications</h1>
    <div class="admin-bar__meta">
      <span data-who hidden></span>
      <button class="btn btn--outline btn--xs" type="button" data-signout hidden>Sign out</button>
    </div>
  </div>
</header>

<main id="main" class="section">
  <div class="container">

    <section data-view="login">
      <div class="card admin-gate">
        <h2>Staff sign in</h2>
        <div class="rule"></div>
        <form data-login novalidate>
          <p class="form-status" role="status" aria-live="polite" data-login-status></p>
          <div class="field">
            <label class="field__label" for="email">Email</label>
            <input type="email" id="email" name="email" required autocomplete="username">
          </div>
          <div class="field">
            <label class="field__label" for="password">Password</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">
          </div>
          <button class="btn btn--navy btn--block" type="submit">Sign in</button>
        </form>
      </div>
    </section>

    <section data-view="totp" hidden>
      <div class="card admin-gate">
        <h2>Second factor</h2>
        <div class="rule"></div>
        <div data-totp-enrol hidden>
          <p>This is an administrator account, so it needs an authenticator app.
             Add this key to Google Authenticator, 1Password, or similar:</p>
          <p class="totp-secret"><code data-totp-secret></code></p>
        </div>
        <form data-totp novalidate>
          <p class="form-status" role="status" aria-live="polite" data-totp-status></p>
          <div class="field">
            <label class="field__label" for="code">6-digit code</label>
            <input type="text" id="code" name="code" required inputmode="numeric"
                   autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}">
          </div>
          <button class="btn btn--navy btn--block" type="submit">Verify</button>
        </form>
      </div>
    </section>

    <section data-view="list" hidden>
      <div class="admin-stats" data-stats></div>
      <div class="admin-toolbar">
        <label class="visually-hidden" for="q">Search applications</label>
        <input type="search" id="q" placeholder="Search name, email, reference…" data-q>
        <label class="visually-hidden" for="status">Filter by status</label>
        <select id="status" data-status></select>
        <button class="btn btn--outline btn--xs" type="button" data-refresh>Refresh</button>
        <a class="btn btn--outline btn--xs" href="/api/staff/export.csv" data-export hidden>Export CSV</a>
      </div>
      <div class="app-table-wrap">
        <table class="app-table">
          <thead>
            <tr>
              <th scope="col">Name</th><th scope="col">Reference</th><th scope="col">Connection</th>
              <th scope="col">Received</th><th scope="col">Status</th><th scope="col">Activity</th>
              <th scope="col"><span class="visually-hidden">Actions</span></th>
            </tr>
          </thead>
          <tbody data-rows></tbody>
        </table>
      </div>
      <p class="admin-empty" data-empty hidden><strong>No applications match.</strong></p>
    </section>

    <section data-view="case" hidden tabindex="-1" data-case></section>

  </div>
</main>

<script src="/assets/js/staff.js" defer></script>
</body>
</html>
